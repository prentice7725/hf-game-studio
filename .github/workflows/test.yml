# 테스트 워크플로. 외부 저장소 의존이 없어 체크아웃 하나로 돈다.
# Node 22(package.json engines 최소)와 24에서 모두 확인한다.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # start·verify 테스트가 실제 git 저장소를 만들어 커밋한다.
      - name: 테스트
        run: npm test
